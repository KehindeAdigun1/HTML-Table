<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam timetable</title>
</head>
<body>
    <table border="6">
        <th>Day</th>
        <th>Subject</th>
        <th>Time</th>

        <tr>
            <td>Monday</td>
            <td>English</td>
            <td>9:00am - 11:00am</td>

        </tr>


        <tr>
            <td>Tuesday</td>
            <td>Math</td>
            <td>1:00pm - 3:00pm</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>Science</td>
            <td>10:00am - 12:00pm</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>History</td>
            <td rowspan="2">2:00pm - 4:00pm</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>Art</td>
            <td></td>
        </tr>
    </table>
</body>
</html>
