<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Tables</title>
</head>
<body>
    <!-- Tables are to arrange data in rows and columns
     Column - vertical 
     Row - horizontal
     th - table header 
     tr - table row 
     td - table data !-->

     <table border="6">
        <th>S/N</th>
        <th>Names</th>
        <th>Account Balance</th>
        <th>University</th>

        <tr>
            <td>1</td>
            <td>David</td>
            <td>$10,00000</td>
            <td>Bowen</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Seun</td>
            <td>$20,00000</td>
            <td>Bowen</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Tolu</td>
            <td>30,00000</td>
            <td>Bowen</td>
        </tr>
</body>
</html>
