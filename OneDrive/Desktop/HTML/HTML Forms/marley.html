<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
    link
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <label for="FirstName">First Name</label>
   <input type="text" id="FirstName" value="first name"><br>

   <label for="LastName">Last Name</label>
   <input type="text" id="LastName" value="last name"><br>

   <h1>Mailing Address</h1>

   <label for="Address">Address</label>
   <input type="text" id="Address" value="Address"><br>
   <label for="Address2">Street Address line2</label>
   <input type="text" id="Address2" value="Street Address line2"><br>

   <label for="City">City</label>
   <input type="text" id="City" value="City">
   <label for="Region">Region</label>
   <input type="text" id="Region" value="Region"><br>

   <label for="PostalCode">Postal/Zip code</label>
   <input type="text" id="PostalCode" value="Postal/Zip code">
   <label for="Country">Country</label>
   <input type="text" id="Country" value="Country"><br>

   <label for="Email">Email Address</label>
   <input type="email" id="Email" placeholder="Email Address">

   <label for="Phone">Contact Phone</label>
   <input type="tel" id="Phone" placeholder="Contact Phone"><br>


  <div class="Quantity-container">

   <div class="Quantity">
        <h2>Adult</h2>
        <p>Quantity</p>
        <input type="number" value="10" min="1" max="10">
        <p>25.00</p>
        <button>Add to Cart</button>
    </div>

    <div class="quantity">
        <h2>Children &amp; Student</h2>
        <p>Quantity</p>
        <input type="number" value="10" min="1" max="10">
        <p>15.00</p>
        <button>Add to Cart</button>
    </div>

</div>
   


</body>
</html>
