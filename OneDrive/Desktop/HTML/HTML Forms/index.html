<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <!-- Forms is a section of the page where users can input data -->
<h1>REGISTRATION FORM</h1>
<form action="">
    <label for="name">First Name</label>
    <input type="text" placeholder="mandela"><br>

    <label for="last-name">Last name</label>
    <input type="text" placeholder="marley"><br>

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="example@gmail.com"><br>

    <label for =Gender>Gender</label>
    <input type="text"><br>

    <label for="phone">Phone</label>
    <input type="tel" placeholder="+2348065865018"><br>

    <label for="Password">Password</label>
    <input type="password" id="Password" placeholder="**************"><br>
</form>
<button type="submit">Submit</button>
</body>
</html>
