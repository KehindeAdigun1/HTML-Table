    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Ludo Board</title>

<style>
table {
       border-collapse: collapse;
}

td {
      width: 30px;
      height: 30px;
      border: 1px solid black;
      text-align: center;
}

.blue {
      background-color: blue;
}

.red {
     background-color: red;
}

.yellow {
      background-color: yellow;
}

.green {
      background-color: green;
}

.path {
      background-color: white;
}

.centre {
       background-color: orange;
       font-size: 12px;
}

.home {
       font-weight: bold;
       color: white;

</style>
</head>

<body>
     <h1>My Ludo Board</h1>

<table>
   <tr>
    <td class="blue home" colspan="3" rowspan="3">
        BLUE
</td>

    <td class="path">↑</td>
    <td class="path">↑</td>
    <td class="path">↑</td>

    <td class="red home" colspan="3" rowspan="3">
        RED
  </td>
</tr>

<tr>
    <td class="path">↑</td>
    <td class="blue">★</td>
    <td class="path">↑</td>
</tr>

<tr>
    <td class="path">↑</td>
    <td class="path">↑</td>
    <td class="path">↑</td>
</tr>

<tr>
    <td class="path">←</td>
    <td class="path">←</td>
    <td class="path">←</td>
    <td class="centre" colspan="3" rowspan="3">
        CENTRE
</td>
    <td class="path">→</td>
    <td class="path">→</td>
    <td class="path">→</td>
</tr>

<tr>
    <td class="path">←</td>
    <td class="yellow">★</td>
    <td class="path">←</td>
    <td class="path">→</td>
    <td class="green">★</td>
    <td class="path">→</td>
</tr>

<tr>
    <td class="path">←</td>
    <td class="path">←</td>
    <td class="path">←</td>
    <td class="path">→</td>
    <td class="path">→</td>
    <td class="path">→</td>
</tr>

<tr>
    <td class="yellow home" colspan="3" rowspan="3">
        YELLOW
</td>

    <td class="path">↓</td>
    <td class="path">↓</td>
    <td class="path">↓</td>

    <td class="green home" colspan="3" rowspan="3">
        GREEN
</td>
</tr>

<tr>
    <td class="path">↓</td>
    <td class="yellow">★</td>
    <td class="path">↓</td>
</tr>

<tr>
    <td class="path">↓</td>
    <td class="path">↓</td>
    <td class="path">↓</td>
</tr>
   </table>
</body>
</html>
